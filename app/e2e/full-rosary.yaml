# Prays the whole Rosary by button, checks the sober ending, and leaves to home.
appId: app.sanctamaria
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Begin'
    timeout: 30000
- tapOn: 'Begin'
- extendedWaitUntil:
    visible: '.*(offer this Rosary|Resume).*'
    timeout: 15000
- runFlow:
    when:
      visible: 'Start over'
    commands:
      - tapOn: 'Start over'
      - extendedWaitUntil:
          visible: '.*offer this Rosary.*'
          timeout: 8000
- runFlow:
    when:
      visible: '.*offer this Rosary.*'
    commands:
      - tapOn: 'Begin'
- extendedWaitUntil:
    visible: 'Next'
    timeout: 15000
- repeat:
    while:
      visible: 'Next'
    commands:
      - tapOn: 'Next'
- assertVisible: 'Five decades.'
- tapOn: 'Finish'
- assertVisible: 'Settings'
