# Leaves mid-decade and checks the app offers to resume at the same place.
appId: app.sanctamaria
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Begin'
    timeout: 30000
- tapOn: 'Begin'
- extendedWaitUntil:
    visible: '.*(offer this Rosary|Resume).*'
    timeout: 15000
- runFlow:
    when:
      visible: 'Start over'
    commands:
      - tapOn: 'Start over'
      - extendedWaitUntil:
          visible: '.*offer this Rosary.*'
          timeout: 8000
- runFlow:
    when:
      visible: '.*offer this Rosary.*'
    commands:
      - tapOn: 'Begin'
- extendedWaitUntil:
    visible: 'Next'
    timeout: 15000
- repeat:
    times: 12
    commands:
      - tapOn: 'Next'
- assertVisible: 'Decade 1 of 5'
- tapOn: 'Leave'
- assertVisible: 'Settings'
- extendedWaitUntil:
    visible: 'Begin'
    timeout: 30000
- tapOn: 'Begin'
- assertVisible: 'Resume'
- tapOn: 'Resume'
- assertVisible: 'Decade 1 of 5'
- tapOn: 'Leave'
