# Leaves mid-decade and checks the app offers to resume at the same place.
appId: app.sanctamaria
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Begin'
    timeout: 30000
- tapOn: 'Begin'
- runFlow:
    when:
      visible: 'Start over'
    commands:
      - tapOn: 'Start over'
- repeat:
    times: 12
    commands:
      - tapOn: 'Next'
- assertVisible: 'Decade 1 of 5'
- tapOn: 'Leave'
- assertVisible: 'Settings'
- extendedWaitUntil:
    visible: 'Begin'
    timeout: 30000
- tapOn: 'Begin'
- assertVisible: 'Resume'
- tapOn: 'Resume'
- assertVisible: 'Decade 1 of 5'
- tapOn: 'Leave'
