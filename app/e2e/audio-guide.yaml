# Taps Listen and checks the guide says its part, holds the silence, and moves on.
appId: app.sanctamaria
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Begin'
    timeout: 30000
- tapOn: 'Begin'
- extendedWaitUntil:
    visible: '.*(offer this Rosary|Resume).*'
    timeout: 15000
- runFlow:
    when:
      visible: 'Start over'
    commands:
      - tapOn: 'Start over'
      - extendedWaitUntil:
          visible: '.*offer this Rosary.*'
          timeout: 8000
- runFlow:
    when:
      visible: '.*offer this Rosary.*'
    commands:
      - tapOn: 'Begin'
- extendedWaitUntil:
    visible: 'Next'
    timeout: 15000
- extendedWaitUntil:
    visible: '.*Sign of the Cross.*'
    timeout: 20000
- tapOn: 'Listen'
- extendedWaitUntil:
    visible: 'Pause'
    timeout: 5000
- extendedWaitUntil:
    visible: '.*Creed.*'
    timeout: 40000
- takeScreenshot: audio-advanced
- tapOn: 'Pause'
