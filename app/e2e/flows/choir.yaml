appId: app.sanctamaria
---
- stopApp
- launchApp
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- extendedWaitUntil:
    visible: 'Begin'
    timeout: 30000
- tapOn: 'Begin'
- extendedWaitUntil:
    visible: '.*offer this Rosary.*'
    timeout: 15000
- tapOn: 'Begin'
- extendedWaitUntil:
    visible: '.*Sign of the Cross.*'
    timeout: 15000
- tapOn: 'Listen'
- extendedWaitUntil:
    visible: 'Pause'
    timeout: 8000
- extendedWaitUntil:
    visible: '.*Apostles.*'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Our Father.*'
    timeout: 60000
- extendedWaitUntil:
    visible: '.*Hail Mary.*'
    timeout: 60000
