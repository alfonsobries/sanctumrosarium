appId: app.sanctamaria
---
- stopApp
- launchApp
- openLink: sanctamaria:///pray
- runFlow:
    when:
      visible: 'Start over'
    commands:
      - tapOn: 'Start over'
- extendedWaitUntil:
    visible: 'Next'
    timeout: 20000
- repeat:
    times: 9
    commands:
      - tapOn: 'Next'
- longPressOn:
    point: '50%,45%'
- takeScreenshot: dark-mode
- longPressOn:
    point: '50%,50%'
- extendedWaitUntil:
    visible: 'Next'
    timeout: 5000
- takeScreenshot: dark-exit
